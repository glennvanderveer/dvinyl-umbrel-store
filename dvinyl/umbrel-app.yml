manifestVersion: 1.1
id: dvinyl-store-dvinyl
category: files
name: DVinyl
version: "2.5.0"
tagline: Catalog your vinyl, CDs, books, movies and games
description: >-
  DVinyl is a self-hostable collection manager for physical media
  enthusiasts. Catalog vinyl records, CDs, and cassettes with Discogs
  metadata and live market value estimates, then extend into books, movies,
  and games with the Hardcover, TMDB, and IGDB integrations. Import an
  entire existing Discogs collection in one click, track where each item
  lives on your shelves, and browse everything through a customizable,
  mobile-friendly dashboard.
